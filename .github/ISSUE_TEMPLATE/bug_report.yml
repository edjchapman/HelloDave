name: Bug report
description: Report a reproducible problem in Repo Explorer Assistant.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the repository path, prompt, and any relevant configuration.
      placeholder: |
        1. Start the app with ...
        2. Select ...
        3. Ask ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Java and OS version
      placeholder: "JDK 21, macOS 15"