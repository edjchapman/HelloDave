version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      kotlin-compose:
        patterns:
          - org.jetbrains.kotlin*
          - org.jetbrains.compose*
      koog:
        patterns:
          - ai.koog*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
