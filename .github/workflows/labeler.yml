name: labeler

# Applies triage labels to PRs based on the changed-file globs in .github/labeler.yml.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7.0.0
