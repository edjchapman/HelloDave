# actions/labeler v5+ config: labels applied to PRs by changed-file globs.
# Triage aid only — release notes are generated by release-please from commits.
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'Makefile', 'scripts/**']
tooling:
  - changed-files:
      - any-glob-to-any-file: ['.githooks/**', '.editorconfig', '.markdownlint-cli2.jsonc']
tests:
  - changed-files:
      - any-glob-to-any-file: ['src/test/**']
app:
  - changed-files:
      - any-glob-to-any-file: ['src/main/**']
build:
  - changed-files:
      - any-glob-to-any-file: ['build.gradle.kts', 'settings.gradle.kts', 'gradle/**', 'gradlew', 'gradlew.bat']
